<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:event type="preRenderView" listener="#{recuperaPasswordBean.initSolicitud}"/>
    </f:metadata>

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title>Recuperar contrasena</title>
        <h:outputScript name="js/layout.js" library="spark-layout" />
        <style type="text/css">
            .passwordMessages {
                width: 92%;
                margin: 20px auto 0 auto;
                text-align: left;
            }
            .passwordMessages .ui-messages-info-summary,
            .passwordMessages .ui-messages-error-summary,
            .passwordMessages .ui-messages-warn-summary {
                display: block;
                margin-bottom: 10px;
                font-weight: 600;
                line-height: 1.25;
            }
            .passwordMessages .ui-messages-info-detail,
            .passwordMessages .ui-messages-error-detail,
            .passwordMessages .ui-messages-warn-detail {
                display: block;
                line-height: 1.35;
            }
        </style>
    </h:head>

    <h:body>
        <h:form id="frmRecuperaPassword">
            <div id="layout-portlets-cover">
                <div class="other-pages-box Container40 Responsive50 MarAuto Fnone TexAlCenter ShadowGray MarTop10"
                     style="margin-top:5%; background-image:url(/Sindicato/resources/spark-layout/images/loginpageillust.svg); background-repeat:no-repeat; background-position:center; background-size:cover;">
                    <div class="Container90 Fnone MarAuto TexAlCenter">
                        <div class="EmptyBox50"></div>
                        <h:graphicImage name="images/LOGO.jpg" library="spark-layout" styleClass="MarAuto MarTop20 MarBot10"/>
                        <div class="EmptyBox20"></div>

                        <p:inputText id="claveEmpleado" value="#{recuperaPasswordBean.claveEmpleado}"
                                     placeholder="Clave empleado"
                                     required="true"
                                     requiredMessage="El campo Clave de empleado es obligatorio"
                                     styleClass="Container80 Fnone MarAuto Fs18"
                                     disabled="#{recuperaPasswordBean.solicitudEnviada}" />
                        <div class="EmptyBox10"></div>

                        <p:selectOneMenu id="empresa" value="#{recuperaPasswordBean.empresa}"
                                         converter="empConverter"
                                         required="true"
                                         requiredMessage="Debe seleccionar la empresa"
                                         styleClass="Container80 Fnone MarAuto Fs18"
                                         disabled="#{recuperaPasswordBean.solicitudEnviada}">
                            <f:selectItem itemLabel="Empresa" itemValue="" />
                            <f:selectItems value="#{recuperaPasswordBean.empresas}" var="emp"
                                           itemLabel="#{emp.empAbreviacion}" itemValue="#{emp}" />
                        </p:selectOneMenu>
                        <div class="EmptyBox10"></div>

                        <p:inputText id="correo" value="#{recuperaPasswordBean.correo}"
                                     placeholder="Correo registrado"
                                     required="true"
                                     requiredMessage="El campo Correo es obligatorio"
                                     validatorMessage="Ingresa un correo valido"
                                     styleClass="Container80 Fnone MarAuto Fs18"
                                     disabled="#{recuperaPasswordBean.solicitudEnviada}">
                            <f:validateRegex pattern="^(([A-Za-z0-9]+_+)|([A-Za-z0-9]+\-+)|([A-Za-z0-9]+\.+)|([A-Za-z0-9]+\++))*[A-Za-z0-9]+@((\w+\-+)|(\w+\.))*\w{1,63}\.[a-zA-Z]{2,6}$" />
                        </p:inputText>

                        <div class="EmptyBox30"></div>
                        <p:commandButton value="Enviar correo"
                                         styleClass="Fs16"
                                         actionListener="#{recuperaPasswordBean.solicitarRecuperacion}"
                                         update=":frmRecuperaPassword"
                                         disabled="#{recuperaPasswordBean.solicitudEnviada}" />
                        <div class="EmptyBox10"></div>
                        <h:link outcome="/login" value="Regresar al login" styleClass="Fs14" />
                        <div class="Seperator"></div>
                        <div class="EmptyBox10"></div>
                        <p:messages id="mensajes" showDetail="true" escape="false"
                                    styleClass="passwordMessages" />
                        <div class="EmptyBox50"></div>
                    </div>
                </div>
            </div>

            <h:outputStylesheet name="css/core-layout.css" library="spark-layout" />
            <h:outputStylesheet name="css/font-awesome.css" library="spark-layout" />
            <h:outputStylesheet name="css/animate.css" library="spark-layout" />
            <h:outputStylesheet name="css/spark-layout.css" library="spark-layout" />
        </h:form>
    </h:body>
</html>

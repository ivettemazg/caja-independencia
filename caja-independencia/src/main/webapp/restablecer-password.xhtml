<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:viewParam name="token" value="#{recuperaPasswordBean.token}" />
        <f:event type="preRenderView" listener="#{recuperaPasswordBean.initRestablecimiento}"/>
    </f:metadata>

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title>Restablecer contrasena</title>
        <h:outputScript name="js/layout.js" library="spark-layout" />
        <style type="text/css">
            .passwordMessages {
                width: 92%;
                margin: 20px auto 0 auto;
                text-align: left;
            }
            .passwordMessages .ui-messages-info-summary,
            .passwordMessages .ui-messages-error-summary,
            .passwordMessages .ui-messages-warn-summary {
                display: block;
                margin-bottom: 10px;
                font-weight: 600;
                line-height: 1.25;
            }
            .passwordMessages .ui-messages-info-detail,
            .passwordMessages .ui-messages-error-detail,
            .passwordMessages .ui-messages-warn-detail {
                display: block;
                line-height: 1.35;
            }
        </style>
    </h:head>

    <h:body>
        <h:form id="frmRestablecePassword">
            <div id="layout-portlets-cover">
                <div class="other-pages-box Container40 Responsive50 MarAuto Fnone TexAlCenter ShadowGray MarTop10"
                     style="margin-top:5%; background-image:url(/Sindicato/resources/spark-layout/images/loginpageillust.svg); background-repeat:no-repeat; background-position:center; background-size:cover;">
                    <div class="Container90 Fnone MarAuto TexAlCenter">
                        <div class="EmptyBox50"></div>
                        <h:graphicImage name="images/LOGO.jpg" library="spark-layout" styleClass="MarAuto MarTop20 MarBot10"/>
                        <div class="EmptyBox20"></div>

                        <h:panelGroup rendered="#{recuperaPasswordBean.passwordActualizado}">
                            <div class="EmptyBox20"></div>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{recuperaPasswordBean.tokenValido and not recuperaPasswordBean.passwordActualizado}">
                            <p:password id="nuevoPassword"
                                        value="#{recuperaPasswordBean.nuevoPassword}"
                                        placeholder="Nuevo password"
                                        required="true"
                                        requiredMessage="El campo Nuevo password es obligatorio"
                                        styleClass="Container80 Fnone MarAuto Fs18"
                                        feedback="false" />
                            <div class="EmptyBox10"></div>
                            <p:password id="confirmaPassword"
                                        value="#{recuperaPasswordBean.confirmaPassword}"
                                        placeholder="Confirmar password"
                                        required="true"
                                        requiredMessage="Debe confirmar el password"
                                        styleClass="Container80 Fnone MarAuto Fs18"
                                        feedback="false" />
                            <div class="EmptyBox30"></div>
                            <p:commandButton value="Actualizar password"
                                             styleClass="Fs16"
                                             action="#{recuperaPasswordBean.restablecerPassword}"
                                             update=":frmRestablecePassword" />
                        </h:panelGroup>

                        <h:panelGroup rendered="#{not recuperaPasswordBean.tokenValido and not recuperaPasswordBean.passwordActualizado}">
                            <h:outputText value="La liga de recuperacion no es valida o ya expiro."
                                          styleClass="Fs16 Red" />
                            <div class="EmptyBox20"></div>
                        </h:panelGroup>

                        <div class="EmptyBox10"></div>
                        <h:outputLink value="#{request.contextPath}/login.xhtml" styleClass="Fs14">
                            <h:outputText value="Regresar al login" />
                        </h:outputLink>
                        <div class="Seperator"></div>
                        <div class="EmptyBox10"></div>
                        <p:messages id="mensajes" showDetail="true" escape="false"
                                    styleClass="passwordMessages" />
                        <div class="EmptyBox50"></div>
                    </div>
                </div>
            </div>

            <h:outputStylesheet name="css/core-layout.css" library="spark-layout" />
            <h:outputStylesheet name="css/font-awesome.css" library="spark-layout" />
            <h:outputStylesheet name="css/animate.css" library="spark-layout" />
            <h:outputStylesheet name="css/spark-layout.css" library="spark-layout" />
        </h:form>
    </h:body>
</html>
